<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Nutrition AI | Ask Anything About Nutrition</title>
    <meta name="description" content="AI-powered nutrition assistant. Get instant answers about vitamins, minerals, diets, and healthy eating.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --user-bubble: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --ai-bubble: rgba(255, 255, 255, 0.05);
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 40% 60%, rgba(16, 185, 129, 0.08) 0%, transparent 30%);
            animation: gradientMove 20s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2%, 2%) rotate(1deg); }
            50% { transform: translate(-1%, 3%) rotate(-1deg); }
            75% { transform: translate(3%, -2%) rotate(0.5deg); }
        }

        /* Header */
        header {
            padding: 20px 24px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--user-bubble);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 20px;
            font-size: 12px;
            color: var(--success);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Chat Container */
        .chat-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Welcome Message */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            gap: 24px;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--user-bubble);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 32px var(--accent-glow);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
        }

        .suggestion-chip {
            padding: 10px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-chip:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* Messages */
        .message-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: messageIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
        }

        .message-user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .message-ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            border-bottom-left-radius: 6px;
            backdrop-filter: blur(10px);
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message-user + .message-time {
            text-align: right;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--ai-bubble);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            max-width: fit-content;
            backdrop-filter: blur(10px);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .typing-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Input Area */
        .input-wrapper {
            padding: 16px 0 24px;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .input-field {
            flex: 1;
            padding: 14px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: var(--user-bubble);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .send-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.2s ease;
        }

        .send-btn:hover:not(:disabled) svg {
            transform: translateX(2px);
        }

        /* Loading State */
        .send-btn.loading svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Keyboard Hint */
        .keyboard-hint {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .keyboard-hint kbd {
            padding: 2px 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
        }

        /* Error State */
        .message-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        /* Responsive */
        @media (max-width: 640px) {
            header {
                padding: 16px;
            }The remaining content

            .logo-text {
                font-size: 18px;
            }

            .welcome-container {
                padding: 40px 16px;
            }

            .welcome-title {
                font-size: 24px;
            }

            .message {
                max-width: 90%;
            }

            .suggestions {
                flex-direction: column;
            }

            .suggestion-chip {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>

    <header>
        <div class="logo">
            <div class="logo-icon">🥗</div>
            <span class="logo-text">Human Nutrition AI</span>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
    </header>

    <div class="chat-wrapper">
        <div class="chat-container" id="chatContainer">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-icon">🧠</div>
                <h1 class="welcome-title">Ask About Nutrition</h1>
                <p class="welcome-subtitle">
                    I'm your AI nutrition assistant. Ask me anything about vitamins, minerals, diets, and healthy eating habits.
                </p>
                <div class="suggestions">
                    <div class="suggestion-chip" onclick="askSuggestion('What are the main sources of Vitamin C?')">
                        🍊 Sources of Vitamin C
                    </div>
                    <div class="suggestion-chip" onclick="askSuggestion('How much protein do I need daily?')">
                        🥩 Daily protein needs
                    </div>
                    <div class="suggestion-chip" onclick="askSuggestion('What foods are rich in iron?')">
                        🥬 Iron-rich foods
                    </div>
                </div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-container">
                <input 
                    type="text" 
                    class="input-field" 
                    id="queryInput" 
                    placeholder="Ask about nutrition..." 
                    autocomplete="off"
                >
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="keyboard-hint">
                Press <kbd>Enter</kbd> to send
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const input = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        let isLoading = false;

        function hideWelcome() {
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }
        }

        function getTime() {
            return new Date().toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function createMessage(text, type, showTime = true) {
            hideWelcome();

            const group = document.createElement('div');
            group.className = 'message-group';

            const msg = document.createElement('div');
            msg.className = `message message-${type}`;
            msg.textContent = text;
            group.appendChild(msg);

            if (showTime) {
                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = getTime();
                group.appendChild(time);
            }

            chatContainer.appendChild(group);
            scrollToBottom();
            return msg;
        }

        function showTyping() {
            hideWelcome();

            const typing = document.createElement('div');
            typing.className = 'message-group';
            typing.id = 'typingIndicator';
            typing.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                    <span class="typing-text">Thinking...</span>
                </div>
            `;
            chatContainer.appendChild(typing);
            scrollToBottom();
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function setLoading(loading) {
            isLoading = loading;
            sendBtn.disabled = loading;
            sendBtn.classList.toggle('loading', loading);
            
            if (loading) {
                sendBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                `;
            } else {
                sendBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                `;
            }
        }

        async function sendMessage() {
            if (isLoading) return;

            const message = input.value.trim();
            if (!message) return;

            createMessage(message, 'user');
            input.value = '';
            input.focus();

            setLoading(true);
            showTyping();

            try {
                const response = await fetch('/api/rag', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: message })
                });

                hideTyping();

                if (!response.ok) {
                    throw new Error('Server error');
                }

                const data = await response.json();
                createMessage(data.answer, 'ai');

            } catch (err) {
                hideTyping();
                const errorMsg = createMessage(
                    '⚠️ Sorry, I encountered an error. Please try again.',
                    'ai'
                );
                errorMsg.classList.add('message-error');
            } finally {
                setLoading(false);
            }
        }

        function askSuggestion(text) {
            input.value = text;
            sendMessage();
        }

        // Enter key handler
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-focus input
        input.focus();
    </script>
</body>
</html>
